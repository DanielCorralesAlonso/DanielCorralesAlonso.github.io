# Curation for _data/projects.yml (generated by sync_projects.py; don't edit that file).
#
# - Public repos of yours tagged with the `portfolio` topic are added automatically,
#   using the repo name, description and GitHub's preview image.
# - Entries below are keyed by repo name. They are always included, and any field
#   given here wins over what GitHub says. Set `hide: true` to drop a repo.
# - Keys that don't match one of your repos are manual projects (e.g. repos owned
#   by an organisation) and need all their fields.
# - Projects appear in the order below. New tagged repos go on top, newest first.
#
# Fields: title, description, image, image_bg_white, paper, github, hide

optimized_crc_incentives_ara:
  title: Designing Incentives for CRC Screening based on Adversarial Risk Analysis
  description: This work presents an approach for designing incentives based on modelling the uncertainty of information
  image: images/incentives.png
  paper: https://ieeexplore.ieee.org/abstract/document/11058786

Decision_Model_Screening_CRC:
  title: Decision Support Model for CRC Screening
  description: This work provides a decision analysis-based approach to personalized CRC screening, supporting decisions concerning whether and which screening method to consider and/or whether a colonoscopy should be administered.
  image: images/id_24_01_page-0001 (1).jpg
  paper: https://www.sciencedirect.com/science/article/pii/S0010482525011060

CRC_Risk_BN:
  title: Colorectal Cancer Risk Mapping
  description: A graphical CRC risk mapping tool is developed from a Bayesian network model and used to segment the population into risk subgroups according to variables of interest.
  image: images/point_risk_map_men_Age_BMI.png
  image_bg_white: true
  paper: https://doi.org/10.1016/j.cmpb.2024.108407

sjogren-syndrome:
  title: Sjögren Syndrome Deep Learning Project
  description: Classifying ultrasound (US) images of the parotid glands (PGs) and submandibular glands (SMGs) using the OMERACT scale
  image: images/001.jpg
  github: https://github.com/AI4RadMic/SjogrenSyndromAI4RadMicDaniPablo

DeepImageBlending:
  title: Deep Image Blending
  description: Deep Image Blending attempts to optimize a Poison blending loss, a style loss anda content loss computed from a VGG pretrained network and then reconstructs the pixels by optimizing a loss function using a LBFGS solver.
  image: images/second_pass.png

TFG:
  title: Minimax risk classifier with &alpha;-losses
  description: We present a series of algorithms for solving supervised classification problems based on decision theory and convex optimization.
  image: images/fig_h_5_D_500.jpg
