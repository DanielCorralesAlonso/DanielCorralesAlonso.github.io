# Curation for _data/publications.yml (generated by sync_publications.py; don't edit that file).
#
# Every work with a DOI in the ORCID record below is listed, newest first, with
# title, authors and venue taken from Crossref (or DataCite for arXiv).

orcid: 0009-0002-2860-2639

# DOIs to leave out, e.g. preprints of papers that are already published.
hide:
  - 10.48550/arxiv.2502.21210  # preprint of the Computers in Biology and Medicine paper

# Author names as publishers spell them -> how they should appear.
author_names:
  "Insua, D.R.": "Ríos Insua, D."

# Logo shown next to each paper, by DOI prefix.
logos:
  "10.1016": images/Elsevier_logo_2019.svg.png
  "10.1109": images/ieee.png
  "10.48550": images/ArXiv_logo_2022.png

# Field overrides by DOI (title, authors, year, venue, logo), and works without a DOI.
overrides: {}
extra: []
