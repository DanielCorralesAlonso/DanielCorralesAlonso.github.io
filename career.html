---
layout: default
title: Career
---
            <section class="max-w-full mx-auto py-10">
                <h2 class="text-3xl font-bold text-center mb-8">Career</h2>
                <div class="grid grid-cols-1 gap-8">
                    {% for item in site.data.career %}
                    <div class="bg-gray-800 text-white p-6 rounded-lg shadow-lg flex items-center gap-6 hover:scale-105 transition-transform duration-300">
                        <img src="{{ item.logo | relative_url }}" alt="{{ item.institution }}" class="w-24 h-24 object-contain bg-white rounded-lg">
                        <div>
                            <h3 class="text-xl font-semibold"><a href="{{ item.url }}" class="text-blue-400 hover:underline">{{ item.institution }}</a></h3>
                            <p class="text-gray-300 mt-2">{{ item.description }}</p>
                            <p class="text-blue-400 font-semibold mt-2">{{ item.dates }}</p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </section>
