---
layout: default
title: CV
---
            <section class="max-w-6xl mx-auto py-8">
                <div class="text-center mb-6">
                    <h2 class="text-3xl font-bold mb-3">Curriculum Vitae</h2>
                    <p class="text-gray-300 max-w-3xl mx-auto">
                        View my CV directly in the browser. If the embedded PDF does not load in your browser, use the download link below.
                    </p>
                    <div class="mt-4 flex flex-wrap justify-center gap-3">
                        <a href="{{ site.cv_pdf | relative_url }}" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg transition" target="_blank" rel="noreferrer noopener">
                            <i class="fas fa-file-pdf"></i>
                            Open PDF
                        </a>
                        <a href="{{ site.cv_pdf | relative_url }}" download class="inline-flex items-center gap-2 bg-gray-700 hover:bg-gray-600 text-white font-semibold px-4 py-2 rounded-lg transition">
                            <i class="fas fa-download"></i>
                            Download
                        </a>
                    </div>
                </div>

                <div class="pdf-shell rounded-2xl overflow-hidden p-3 sm:p-4">
                    <object data="{{ site.cv_pdf | relative_url }}" type="application/pdf" class="pdf-frame">
                        <div class="flex items-center justify-center min-h-[70vh] text-center px-6">
                            <div>
                                <p class="text-xl font-semibold mb-3">Your browser cannot display the CV PDF inline.</p>
                                <p class="text-gray-300 mb-4">Use the buttons above to open or download the file.</p>
                                <a href="{{ site.cv_pdf | relative_url }}" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg transition" target="_blank" rel="noreferrer noopener">
                                    <i class="fas fa-file-pdf"></i>
                                    Open PDF
                                </a>
                            </div>
                        </div>
                    </object>
                </div>
            </section>
