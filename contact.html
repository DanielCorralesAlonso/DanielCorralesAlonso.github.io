---
layout: default
title: Contact
---
            <!-- Contact Info Section -->
            <section class="max-w-full mx-auto py-10">
                <h2 id="get-in-touch" class="text-3xl font-bold text-center mb-8">Get in Touch</h2>
                <p id="reach-out-text" class="text-2xl font-semibold text-white text-center mb-8">Feel free to reach out to me anytime!</p>

                <div class="mb-6 text-center">
                    <p class="text-gray-100">Connect with me:</p>
                    <div class="flex flex-wrap justify-center gap-6">
                        {% for link in site.data.social %}
                        <a href="{{ link.url }}" class="social-link text-white hover:text-blue-500">
                            <i class="{{ link.icon }}"></i> {{ link.name }}
                        </a>
                        {% endfor %}
                    </div>
                </div>
            </section>

            <!-- Email Form Section -->
            <section class="max-w-full mx-auto py-10 bg-gray-800 rounded-lg shadow-lg">
                <h2 class="text-3xl font-semibold text-center mb-6">Send Me an Email</h2>
                <form action="mailto:daniel.corrales@icmat.es" method="POST" enctype="text/plain">
                    <div class="flex flex-col gap-4">
                        <input type="text" name="name" placeholder="Your Name" class="p-4 rounded-lg bg-gray-700 text-white w-full" required>
                        <input type="email" name="email" placeholder="Your Email" class="p-4 rounded-lg bg-gray-700 text-white w-full" required>
                        <textarea name="message" placeholder="Your Message" class="p-4 rounded-lg bg-gray-700 text-white w-full" rows="5" required></textarea>
                        <button type="submit" class="bg-blue-600 p-4 rounded-lg text-white hover:bg-blue-700 w-full">Send Message</button>
                    </div>
                </form>
            </section>
